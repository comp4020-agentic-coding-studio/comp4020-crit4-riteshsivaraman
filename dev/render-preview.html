<!doctype html>
<!--
  SCRATCH — Issue 5 dev harness, not part of the built site.

  Not served by `astro build` (lives outside src/pages and public/), so it
  never reaches dist/ and spec/invariants.test.ts never sees it.

  Astro's dev router 404s on any .html request that isn't a page under
  src/pages, so this file itself can't be opened through `pnpm dev` alone.
  Run `pnpm dev` (keeps Vite transforming render-preview.ts on :4321 — that
  part IS reachable, hence the absolute script src below) AND a second
  static server for this raw html, e.g. from the repo root:
    python3 -m http.server 5500
  then open http://localhost:5500/dev/render-preview.html.
  Delete this whole file (and .ts) once Issue 6 wires the real page.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>render preview — scratch</title>
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 1;
        font-family: var(--face-utility);
        font-size: 12px;
        background: #fff8;
        padding: 6px 8px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <span id="stats">—</span>
      <button id="spawn200">spawn 200</button>
      <button id="clear">clear</button>
    </div>
    <canvas id="stage"></canvas>
    <script type="module" src="http://localhost:4321/dev/render-preview.ts"></script>
  </body>
</html>
